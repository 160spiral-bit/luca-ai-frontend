<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Luca tab icon: geometric L monogram, stroke-drawn so joins and caps are
       uniformly rounded. Solid tile + solid glyph reads at 16px, where the old
       transparent spark washed out. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111516"/>
  <path d="M25 17 V45 H41" fill="none" stroke="#f4f6f6" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
